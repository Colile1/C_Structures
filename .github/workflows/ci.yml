name: CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          build-essential cmake ninja-build \
          libeigen3-dev libglm-dev libgtest-dev

    - name: Configure
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_STANDARD=17 \
          -DBUILD_APP=OFF

    - name: Build tests
      run: cmake --build build --target tests --parallel

    - name: Test
      run: ctest --test-dir build --output-on-failure -V

  wasm-solver:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: latest

    - name: Configure (wasm)
      run: emcmake cmake -S wasm -B build-wasm -DCMAKE_BUILD_TYPE=Release

    - name: Build solver core to WebAssembly
      run: cmake --build build-wasm --parallel

    - name: Run the wasm harness (matches native results)
      run: node wasm/harness.mjs build-wasm/solver_core.js
